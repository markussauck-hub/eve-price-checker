name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["web/**", ".github/workflows/pages.yml", "README.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version (z. B. v1.0.0) – leer lassen für reinen Build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Abhängigkeiten
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          echo "::notice title=Schritt::Abhängigkeiten OK ($(python --version))"

      - name: Live-Test gegen ESI
        shell: bash
        run: |
          set +e
          out=$(python tests/smoke_esi.py 2>&1); rc=$?
          msg=$(printf '%s' "$out" | tail -n 12 | tr '\n' '~' | sed 's/~/%0A/g')
          if [ $rc -ne 0 ]; then echo "::error title=ESI-Test::$msg"; exit 1; fi
          echo "::notice title=ESI-Test::$msg"

      - name: GUI-Start-Test
        shell: python
        env:
          PYTHONUTF8: "1"
        run: |
          import traceback, sys, os
          sys.path.insert(0, os.getcwd())
          try:
              import tkinter as tk, eve_price_checker as m
              m.load_item_db = lambda: ({"Tritanium": 34}, None)
              root = tk.Tk(); app = m.PriceCheckerApp(root)
              res = {}
              def check():
                  root.update()
                  res["state"] = str(app.combo.cget("state"))
                  res["status"] = app.status_label.cget("text")
                  root.destroy()
              root.after(1500, check); root.mainloop()
              assert res.get("state") == "normal", res
              print("::notice title=GUI::OK - " + res["status"])
          except BaseException:
              print("::error title=GUI::" + traceback.format_exc().replace(chr(10), "%0A"))
              sys.exit(1)

      - name: exe bauen
        shell: bash
        run: |
          set +e
          out=$(pyinstaller --noconfirm --clean EVE_Price_Checker.spec 2>&1); rc=$?
          msg=$(printf '%s' "$out" | tail -n 12 | tr '\n' '~' | sed 's/~/%0A/g')
          if [ $rc -ne 0 ]; then echo "::error title=PyInstaller::$msg"; exit 1; fi
          echo "::notice title=Schritt::PyInstaller OK"

      - name: exe prüfen
        shell: pwsh
        run: |
          $f = Get-Item dist/EVE_Price_Checker.exe
          "{0:N1} MB" -f ($f.Length / 1MB)
          $p = Start-Process $f.FullName -PassThru
          Start-Sleep 8
          if ($p.HasExited) { "::error title=exe::beendet sich sofort (ExitCode $($p.ExitCode))"; exit 1 }
          Stop-Process $p -Force
          "::notice title=exe::läuft – {0:N1} MB" -f ($f.Length / 1MB)

      - uses: actions/upload-artifact@v5
        with:
          name: EVE_Price_Checker
          path: dist/EVE_Price_Checker.exe

      - name: Release (bei Tag oder manuell mit Version)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: EVE Price Checker ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/EVE_Price_Checker.exe
