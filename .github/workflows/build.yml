name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Abhängigkeiten
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          echo "::notice title=Schritt::Abhängigkeiten OK ($(python --version))"

      - name: Live-Test gegen ESI
        shell: pwsh
        run: |
          python tests/smoke_esi.py 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { "::error title=ESI-Test::$(($out | Select-Object -Last 8) -join ' %0A ')"; exit 1 }
          "::notice title=ESI-Test::$(($out | Select-Object -Last 9) -join ' %0A ')"

      - name: GUI-Start-Test
        shell: python
        run: |
          import tkinter as tk, eve_price_checker as m
          m.load_item_db = lambda: ({"Tritanium": 34}, None)
          root = tk.Tk(); app = m.PriceCheckerApp(root)
          def check():
              root.update()
              assert app.combo.cget("state") == "normal", app.combo.cget("state")
              print("::notice title=GUI::OK –", app.status_label.cget("text"))
              root.destroy()
          try:
              root.after(1500, check); root.mainloop()
          except Exception as e:
              print(f"::error title=GUI::{e!r}"); raise

      - name: exe bauen
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean EVE_Price_Checker.spec 2>&1 | Tee-Object -Variable out | Out-Null
          if ($LASTEXITCODE -ne 0) { "::error title=PyInstaller::$(($out | Select-Object -Last 10) -join ' %0A ')"; exit 1 }
          "::notice title=Schritt::PyInstaller OK"

      - name: exe prüfen
        shell: pwsh
        run: |
          $f = Get-Item dist/EVE_Price_Checker.exe
          "{0:N1} MB" -f ($f.Length / 1MB)
          $p = Start-Process $f.FullName -PassThru
          Start-Sleep 8
          if ($p.HasExited) { "::error title=exe::beendet sich sofort (ExitCode $($p.ExitCode))"; exit 1 }
          Stop-Process $p -Force
          "::notice title=exe::läuft – {0:N1} MB" -f ($f.Length / 1MB)

      - uses: actions/upload-artifact@v5
        with:
          name: EVE_Price_Checker
          path: dist/EVE_Price_Checker.exe

      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EVE_Price_Checker.exe
